function ng(g){
 const r=g.index?g.toNonIndexed():g;
 if(r!==g)g.dispose();
 for(const k of Object.keys(r.attributes)){if(!['position','normal','uv','color'].includes(k))r.deleteAttribute(k);}
 r.clearGroups();
 return r;
}
function colorize(g,hex){
 const c=new THREE.Color(hex),n=g.attributes.position.count,a=new Float32Array(n*3);
 for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b;}
 g.setAttribute('color',new THREE.BufferAttribute(a,3));
 return g;
}
function profileGeo(pts,width,bevel){
 const sh=new THREE.Shape();
 sh.moveTo(pts[0][0],pts[0][1]);
 for(let i=1;i<pts.length;i++)sh.lineTo(pts[i][0],pts[i][1]);
 sh.closePath();
 const depth=Math.max(0.02,width-2*bevel);
 const g=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel*0.9,bevelSegments:3,curveSegments:1});
 g.rotateY(-Math.PI/2);
 g.translate(depth/2,0,0);
 return g;
}
function wheelGeometry(wr,ww,rimColor,ratio){
 const parts=[];
 const tire=new THREE.CylinderGeometry(wr,wr,ww,22);tire.rotateZ(Math.PI/2);parts.push(colorize(ng(tire),'#0c0c0d'));
 const rr=wr*ratio;
 const disc=new THREE.CylinderGeometry(rr*0.97,rr*0.97,ww+0.02,18);disc.rotateZ(Math.PI/2);parts.push(colorize(ng(disc),'#202427'));
 const hub=new THREE.CylinderGeometry(rr*0.28,rr*0.28,ww+0.07,10);hub.rotateZ(Math.PI/2);parts.push(colorize(ng(hub),rimColor));
 for(let k=0;k<4;k++){const sp=new THREE.BoxGeometry(ww+0.05,rr*1.85,0.07);sp.rotateX(k*Math.PI/4);parts.push(colorize(ng(sp),rimColor));}
 for(const sx of [-1,1]){const t=new THREE.TorusGeometry(rr*0.93,0.04,6,20);t.rotateY(Math.PI/2);t.translate(sx*(ww/2+0.012),0,0);parts.push(colorize(ng(t),rimColor));}
 return mergeGeometries(parts);
}

function groundAt(x,z){
 if(Math.abs(x)>HALF||Math.abs(z)>HALF)return 0;
 const u=(x+HALF)/S,w=(z+HALF)/S;
 const fx=Math.abs(u-Math.floor(u)-0.5)*S,fz=Math.abs(w-Math.floor(w)-0.5)*S;
 let baseH = (fx<SLAB/2&&fz<SLAB/2)?SLAB_H:0;
 // حساب الارتفاع للجبال القابلة للصعود
 for(const m of mountains){
  const dist = Math.hypot(x-m.x, z-m.z);
  if(dist < m.r){
   let h = Math.max(0, m.h * (1 - dist/m.r));
   if(h > baseH) baseH = h;
  }
 }
 return baseH;
}
function stepVehicle(v,inp,dt){
 const d=v.d,s=v.stats;
 const sh=Math.sin(v.h),ch=Math.cos(v.h);
 const fx=sh,fz=ch,rx=-ch,rz=sh;
 const vF=v.vx*fx+v.vz*fz,vL=v.vx*rx+v.vz*rz;
 const aF0=Math.abs(vF);
 const rainK=save.rain?0.82:1;
 let nit=false;
 if(inp.nitro&&v.nitro>0.02&&vF>4&&inp.throttle>0.05){nit=true;v.nitro=Math.max(0,v.nitro-dt*0.28);}
 else v.nitro=Math.min(s.nitroCap,v.nitro+dt*0.035);
 v.nitroOn=nit;
 const vmax=s.vmax*(nit?1.22:1);
 let a=0;
 if(inp.throttle>0){
  const r=Math.max(vF,0)/vmax;
  a+=s.accel*inp.throttle*Math.max(0,1-Math.pow(Math.min(r,1.3),2.4));
  if(nit)a+=9;
  if(vF<-0.5)a+=s.brake*0.8*inp.throttle;
 }
 if(inp.brake>0){
  if(vF>0.8)a-=s.brake*inp.brake;
  else{const r=Math.max(-vF,0)/12;a-=s.accel*0.45*inp.brake*Math.max(0,1-r*r);}
 }
 if(inp.hand){a-=Math.sign(vF)*5;}
 const idle=inp.throttle===0&&inp.brake===0;
 if(idle)a-=vF*0.05+Math.sign(vF)*0.5;
 a-=vF*aF0*0.0009;
 const maxLat=s.grip*1.15*rainK*(inp.hand?0.6:1);
 let gripK=s.grip*rainK;
 gripK*=1-d.drive*0.28*inp.throttle*Math.min(1,Math.abs(v.yaw)/0.9)*Math.min(1,aF0/12);
 const damp=inp.hand?gripK*0.1:gripK*(Math.abs(vL)>2.8?0.55:1);
 const aL=clamp(-vL*damp,-maxLat,maxLat);
 const wb=d.fz-d.rz;
 const latSteer=maxLat*1.35*(inp.hand?1.4:1);
 const maxAng=Math.min(inp.hand?0.7:0.6,Math.atan(latSteer*wb/Math.max(aF0*aF0,6)));
 const bias=inp.hand?0:-clamp(vL/(aF0+5),-0.4,0.4)*(v.isPlayer?1:0.5);
 const target=clamp(inp.steer+bias,-1.15,1.15)*maxAng;
 v.steerAng+=(target-v.steerAng)*Math.min(1,dt*14);
 let yawT=vF*Math.tan(v.steerAng)/wb;
 if(inp.hand&&aF0>4)yawT*=1.45;
 v.yaw+=(yawT-v.yaw)*Math.min(1,dt*(inp.hand?4:10));
 v.h+=v.yaw*dt;
 v.vx+=(a*fx+aL*rx)*dt;
 v.vz+=(a*fz+aL*rz)*dt;
 if(idle){const nf=v.vx*Math.sin(v.h)+v.vz*Math.cos(v.h);if(Math.abs(nf)<0.4&&Math.abs(vL)<0.6){v.vx=0;v.vz=0;}}
 v.x+=v.vx*dt;v.z+=v.vz*dt;
 v.vF=vF;v.vL=vL;v.aF=a;v.aLat=vF*v.yaw;
}
function onCrash(v,imp){

  for(let i=0;i<4;i++)emitSprite(v.x,v.y+0.6,v.z,(Math.random()-0.5)*4,1+Math.random()*2,(Math.random()-0.5)*4,'#ffb347',0.5,0.45,true);}
}
function resolveHit(v,nx,nz,pen,lx,lz){
 v.x+=nx*pen;v.z+=nz*pen;
 const vn=v.vx*nx+v.vz*nz;
 if(vn<0){
  const imp=-vn;
  v.vx-=1.22*vn*nx;v.vz-=1.22*vn*nz;
  v.vx*=0.985;v.vz*=0.985;
  v.yaw+=clamp((lz*nx-lx*nz)*imp*0.035,-1.2,1.2);
  if(imp>2.5)onCrash(v,imp);
 }
}
function collideWorld(v){
 const d=v.d,sh=Math.sin(v.h),ch=Math.cos(v.h),r=d.W*0.5+0.05;
 for(let ci=0;ci<3;ci++){
  const o=(1-ci)*d.L*0.27;
  let cx=v.x+sh*o,cz=v.z+ch*o;
  if(cx>LIM-r)resolveHit(v,-1,0,cx-(LIM-r),sh*o,ch*o);
  if(cx<-LIM+r)resolveHit(v,1,0,(-LIM+r)-cx,sh*o,ch*o);
  if(cz>LIM-r)resolveHit(v,0,-1,cz-(LIM-r),sh*o,ch*o);
  if(cz<-LIM+r)resolveHit(v,0,1,(-LIM+r)-cz,sh*o,ch*o);
  cx=v.x+sh*o;cz=v.z+ch*o;
  const bi=Math.floor((cx+HALF)/S),bj=Math.floor((cz+HALF)/S);
  if(bi>=0&&bi<N&&bj>=0&&bj<N){
   const list=blockCol.get(bi*32+bj);
   if(list)for(const b of list){
    const px=clamp(cx,b.x0,b.x1),pz=clamp(cz,b.z0,b.z1);
    const dx=cx-px,dz=cz-pz,d2=dx*dx+dz*dz;
    if(d2<r*r){
     let nx,nz,pen;
     if(d2>1e-8){const dd=Math.sqrt(d2);nx=dx/dd;nz=dz/dd;pen=r-dd;}
     else{
      const l=cx-b.x0,rr=b.x1-cx,t=cz-b.z0,bt=b.z1-cz,m=Math.min(l,rr,t,bt);
      if(m===l){nx=-1;nz=0;pen=l+r;}else if(m===rr){nx=1;nz=0;pen=rr+r;}else if(m===t){nx=0;nz=-1;pen=t+r;}else{nx=0;nz=1;pen=bt+r;}
     }
     resolveHit(v,nx,nz,pen,sh*o,ch*o);
     cx=v.x+sh*o;cz=v.z+ch*o;
    }
   }
  }
 }
}
function collideCars(){
 const n=vehicles.length;
 for(let i=0;i<n;i++){
  const a=vehicles[i];
  for(let j=i+1;j<n;j++){
   const b=vehicles[j];
   const ddx=a.x-b.x,ddz=a.z-b.z,lim=(a.d.L+b.d.L)*0.5+1;
   if(ddx*ddx+ddz*ddz>lim*lim)continue;
   const sa=Math.sin(a.h),ca=Math.cos(a.h),sb=Math.sin(b.h),cb=Math.cos(b.h);
   const ra=a.d.W*0.5+0.05,rb=b.d.W*0.5+0.05;
   let done=false;
   for(let ia=0;ia<3&&!done;ia++){
    const oa=(1-ia)*a.d.L*0.27,ax=a.x+sa*oa,az=a.z+ca*oa;
    for(let ib=0;ib<3;ib++){
     const ob=(1-ib)*b.d.L*0.27,bx=b.x+sb*ob,bz=b.z+cb*ob;
     const dx=ax-bx,dz=az-bz,rr=ra+rb,d2=dx*dx+dz*dz;
     if(d2<rr*rr){
      const dist=Math.sqrt(d2)||0.001,nx=dx/dist,nz=dz/dist,pen=rr-dist;
      const ma=a.d.mass,mb=b.d.mass,wa=mb/(ma+mb),wb=ma/(ma+mb);
      a.x+=nx*pen*wa;a.z+=nz*pen*wa;b.x-=nx*pen*wb;b.z-=nz*pen*wb;
      const rvn=(a.vx-b.vx)*nx+(a.vz-b.vz)*nz;
      if(rvn<0){
       const jimp=-(1.35)*rvn/(1/ma+1/mb);
       a.vx+=jimp/ma*nx;a.vz+=jimp/ma*nz;b.vx-=jimp/mb*nx;b.vz-=jimp/mb*nz;
       a.yaw+=clamp((az-a.z)*nx*0.03*-rvn-(ax-a.x)*nz*0.03*-rvn,-1,1);
       b.yaw+=clamp(-((bz-b.z)*nx*0.03*-rvn)+(bx-b.x)*nz*0.03*-rvn,-1,1);
       if(-rvn>3){if(a.isPlayer)onCrash(a,-rvn);else if(b.isPlayer)onCrash(b,-rvn);}
      }
      done=true;break;
     }
    }
   }
  }
 }
}

function updateVisual(v,dt){

 v.pitch+=(pT-v.pitch)*Math.min(1,dt*6);v.roll+=(rT-v.roll)*Math.min(1,dt*6);

 for(const w of vis.wheels){
  w.spin.rotation.x+=v.vF/w.r*dt;
  if(w.front)w.pivot.rotation.y=v.steerAng;
 }
 const braking=(v.input.brake>0&&v.vF>0.5)||v.input.hand;

 const sh=Math.sin(v.h),ch=Math.cos(v.h),rx=-ch,rz=sh;
 const slip=Math.abs(v.vL);

 if(sliding){
  v.skidT-=dt;
  if(v.skidT<=0){
   v.skidT=0.04;
   for(const sx of [-1,1]){

function applyViewOffset(){
 if(!camera)return;
 const W=window.innerWidth,H=window.innerHeight;
 if(garageOpen){
  const land=W>=700&&W>H;
  camera.setViewOffset(W,H,land?W*0.17:0,land?0:H*0.2,W,H);
 }else camera.clearViewOffset();

function updateCamera(dt){
 const v=player,sp=Math.hypot(v.vx,v.vz);
 let fovT;
 if(garageOpen){
  if(!dragging)garageAng+=dt*0.35;
  const R=7.4+(v.d.L-4.5)*0.7;
  camera.position.set(v.x+Math.sin(garageAng)*R,2.1,v.z+Math.cos(garageAng)*R);
  camera.up.set(0,1,0);camera.lookAt(v.x,0.8,v.z);
  fovT=42;
 }else{
  camHead+=angDiff(camHead,v.h)*(1-Math.exp(-(camMode===2?40:4.5)*dt));
  const fx=Math.sin(camHead),fz=Math.cos(camHead);
  camera.up.set(0,1,0);
  if(camMode===2){
   camera.position.set(v.x+fx*0.1,v.y+v.d.hr-0.15+(v.o.ride>0?0.12:0),v.z+fz*0.1);
   camera.lookAt(v.x+fx*25,v.y+1.1,v.z+fz*25);
  }else if(camMode===3){
   camera.position.set(v.x-Math.sin(v.h)*8,48+sp*0.5,v.z-Math.cos(v.h)*8);
   camera.up.set(Math.sin(v.h),0,Math.cos(v.h));camera.lookAt(v.x,v.y,v.z);
  }else{
   const dist=camMode===0?7.4+Math.min(sp*0.05,3.5):5.4+Math.min(sp*0.03,2),height=camMode===0?3.0+sp*0.01:1.9+sp*0.006;
   const tx=v.x-fx*dist,ty=v.y+height,tz=v.z-fz*dist;
   const k=1-Math.exp(-10*dt);
   camera.position.x+=(tx-camera.position.x)*k;camera.position.y+=(ty-camera.position.y)*k;camera.position.z+=(tz-camera.position.z)*k;
   camera.lookAt(v.x+fx*6,v.y+1.2,v.z+fz*6);
  }
  fovT=(camMode===2?72:62)+clamp(sp*0.42,0,28)+(v.nitroOn?8:0);
  if(shake>0.01||sp>38){
   const s=shake*0.35+(sp>38?(sp-38)*0.003:0);
   camera.position.x+=(Math.random()-0.5)*s;camera.position.y+=(Math.random()-0.5)*s;
  }
  shake*=Math.exp(-5*dt);
 }
 fovCur+=(fovT-fovCur)*Math.min(1,dt*4);
 if(Math.abs(camera.fov-fovCur)>0.05){camera.fov=fovCur;camera.updateProjectionMatrix();}
}

const Snd={ctx:null,master:null,eng:null,tire:null,noise:null,
 init(){

   const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=600;
   const g=c.createGain();g.gain.value=0;
   o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(this.master);o1.start();o2.start();
   this.eng={o1,o2,lp,g};
   const buf=c.createBuffer(1,c.sampleRate,c.sampleRate),dd=buf.getChannelData(0);

   const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=0.8;
   const ng2=c.createGain();ng2.gain.value=0;ns.connect(bp);bp.connect(ng2);ng2.connect(this.master);ns.start();
   this.tire={ng:ng2};
  }catch(e){}
 },
 setOn(on){if(this.master)this.master.gain.value=on?0.8:0;},
 update(rpm,thr,slip,nit){
  if(!this.eng)return;
  const t=this.ctx.currentTime,f=38+rpm*150;
  this.eng.o1.frequency.setTargetAtTime(f,t,0.05);this.eng.o2.frequency.setTargetAtTime(f*0.5,t,0.05);
  this.eng.lp.frequency.setTargetAtTime(350+rpm*900+thr*500,t,0.08);

 },

  const g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  g.gain.setValueAtTime(clamp(imp/14,0.15,0.9),c.currentTime);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.35);
  s.connect(lp);lp.connect(g);g.connect(this.master);s.start();s.stop(c.currentTime+0.4);
 },

function bindHold(id,key){
 const el=$(id);
 if(!el)return;
 const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('pressed');Snd.init();};
 const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('pressed');};
 el.addEventListener('pointerdown',down);
 el.addEventListener('pointerup',up);
 el.addEventListener('pointercancel',up);
 el.addEventListener('touchstart',e=>{e.preventDefault();down(e);},{passive:false});
 el.addEventListener('touchend',e=>{e.preventDefault();up(e);},{passive:false});
 el.addEventListener('touchcancel',e=>{e.preventDefault();up(e);},{passive:false});
 el.addEventListener('contextmenu',e=>e.preventDefault());
}
['gas','brake','left','right','hand','nitro'].forEach(k=>bindHold(k,k));

async function enableTilt(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=='granted'){toast('ما انسمح لحساس الميلان');return false;}
  }
  if(!tiltOn){window.addEventListener('deviceorientation',onTilt);tiltOn=true;}
  return true;
 }catch(e){toast('جهازك ما يدعم الميلان');return false;}
}
function onTilt(e){
 const ang=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);
 const g=e.gamma||0,b=e.beta||0;
 let t=ang===90?b:ang===270||ang===-90?-b:ang===180?-g:g;
 if(save.invertTilt)t=-t;
 const dz=2.5;t=Math.abs(t)<dz?0:t-Math.sign(t)*dz;
 tilt=-clamp(t/26,-1,1);
}
function readInput(dt){
 const inp=player.input;
 let thr=keys.gas?1:0,brk=keys.brake?1:0,hand=keys.hand,nit=keys.nitro;
 let target=(keys.left?1:0)-(keys.right?1:0),analog=false;
 const pads=navigator.getGamepads?navigator.getGamepads():[];
 const gp=pads&&pads[0];
 if(gp&&gp.connected){
  const ax=gp.axes[0]||0;
  if(Math.abs(ax)>0.12){target=-ax;analog=true;}
  const rt=gp.buttons[7]?gp.buttons[7].value:0,lt=gp.buttons[6]?gp.buttons[6].value:0;
  thr=Math.max(thr,rt);brk=Math.max(brk,lt);
  hand=hand||!!(gp.buttons[0]&&gp.buttons[0].pressed);
  nit=nit||!!(gp.buttons[2]&&gp.buttons[2].pressed)||!!(gp.buttons[5]&&gp.buttons[5].pressed);
  const y=!!(gp.buttons[3]&&gp.buttons[3].pressed),st=!!(gp.buttons[9]&&gp.buttons[9].pressed);
  if(y&&!gpPrev.y)toggleCamera();if(st&&!gpPrev.s)togglePause();
  gpPrev.y=y;gpPrev.s=st;
 }
 if(save.control==='tilt'&&tiltOn&&target===0){target=tilt;analog=Math.abs(tilt)>0.001;}
 const rate=analog?14:(target===0?7:(Math.sign(target)!==Math.sign(ps.steer)&&ps.steer!==0?11:5.2*save.sens));
 ps.steer=moveToward(ps.steer,target,rate*dt);
 inp.throttle=thr;inp.brake=brk;inp.hand=!!hand;inp.nitro=!!nit;inp.steer=ps.steer;
}

const GEAR_F=[0.17,0.33,0.5,0.67,0.83,1.0];
function gearInfo(v){
 const sp=Math.abs(v.vF);
 if(v.vF<-0.8)return{g:'R',rpm:clamp(0.2+sp/14*0.6,0.2,0.9)};
 if(sp<0.6)return{g:'N',rpm:0.14};
 const r=sp/v.stats.vmax;let g=0;
 while(g<5&&r>GEAR_F[g])g++;
 const lo=g?GEAR_F[g-1]:0,hi=GEAR_F[g],frac=clamp((r-lo)/(hi-lo),0,1);
 return{g:String(g+1),rpm:g===0?0.15+0.8*frac:0.4+0.58*frac};
}
const mm=$('minimap'),mctx=mm.getContext('2d');
function drawMinimap(){
 const w=mm.width,c=w/2,sc=0.25,v=player,sh=Math.sin(v.h),ch=Math.cos(v.h);
 const tx=(x,z)=>{const dx=x-v.x,dz=z-v.z;return[c+(-dx*ch+dz*sh)*sc,c-(dx*sh+dz*ch)*sc];};
 mctx.clearRect(0,0,w,w);
 mctx.save();mctx.beginPath();mctx.arc(c,c,c-2,0,TAU);mctx.clip();
 mctx.fillStyle='rgba(6,12,9,0.92)';mctx.fillRect(0,0,w,w);
 mctx.strokeStyle='#1f4a26';mctx.lineWidth=W_ROAD*sc*0.8;mctx.lineCap='butt';
 mctx.beginPath();
 for(let k=0;k<=N;k++){
  const p=nodeC(k);
  let a=tx(p,-HALF),b=tx(p,HALF);mctx.moveTo(a[0],a[1]);mctx.lineTo(b[0],b[1]);
  a=tx(-HALF,p);b=tx(HALF,p);mctx.moveTo(a[0],a[1]);mctx.lineTo(b[0],b[1]);
 }
 mctx.stroke();
 mctx.restore();
 mctx.fillStyle='#39ff14';mctx.beginPath();mctx.moveTo(c,c-11);mctx.lineTo(c+7,c+8);mctx.lineTo(c-7,c+8);mctx.closePath();mctx.fill();
 mctx.strokeStyle='#39ff1488';mctx.lineWidth=3;mctx.beginPath();mctx.arc(c,c,c-2,0,TAU);mctx.stroke();
}
function updateHUD(dt){
 const v=player,gi=gearInfo(v);
 const target=v.input.throttle>0&&Math.abs(v.vF)<2?Math.max(gi.rpm,0.55):gi.rpm;
 v.rpm+=(target-v.rpm)*Math.min(1,dt*8);
 hudTick++;
 if(hudTick%3===0){
  $('speed').textContent=Math.round(Math.abs(v.vF)*3.6);
  $('gear').textContent=gi.g==='N'?'N':gi.g==='R'?'R · REVERSE':'D'+gi.g;
  const rb=$('rpmBar');rb.style.width=Math.round(v.rpm*100)+'%';rb.style.background=v.rpm>0.9?'#ff3b3b':'#39ff14';
  $('nitBar').style.width=Math.round(v.nitro/v.stats.nitroCap*100)+'%';
  if(hudTick%2===0)drawMinimap();
 }
 Snd.update(v.rpm,v.input.throttle,Math.abs(v.vL)/8,v.nitroOn);
}

function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-lastT)/1000||0.016,0.05);lastT=t;
 const active=!paused&&!garageOpen&&!settingsOpen;
 if(active){
  readInput(dt);
  const sub=2,h=dt/sub;
  for(let k=0;k<sub;k++){
   for(const v of vehicles){stepVehicle(v,v.input,h);collideWorld(v);}
   collideCars();
  }
 }
 for(const v of vehicles){
  updateVisual(v,active?dt:0.0001);
 }
 updateEffects(dt);
 updateCamera(dt);
 const dir=todCur?todCur.dir:[0.5,0.6,-0.4];
 const dl=Math.hypot(dir[0],dir[1],dir[2]);
 sun.position.set(player.x+dir[0]/dl*120,dir[1]/dl*120,player.z+dir[2]/dl*120);
 sun.target.position.set(player.x,0,player.z);sun.target.updateMatrixWorld();
 sky.position.copy(camera.position);stars.position.copy(camera.position);
 skyDisc.position.set(camera.position.x+dir[0]/dl*800,camera.position.y+dir[1]/dl*800,camera.position.z+dir[2]/dl*800);
 updateRain(dt);
 if(active||garageOpen)updateHUDSafe(dt);
 renderer.render(scene,camera);
 frames++;fpsT+=dt;
 if(fpsT>=1){$('fps').textContent=Math.round(frames/fpsT);frames=0;fpsT=0;}
}
function updateHUDSafe(dt){if(!garageOpen)updateHUD(dt);}
